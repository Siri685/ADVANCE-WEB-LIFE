<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        *{
            margin:0;
            padding:0;
            background-color: black;
            box-sizing: border-box;

        }
        html,body{
            width: 100vw;
            height: 100vh;
            display:flex;
            justify-content: center;
            align-content: center;


        }
        .container{
            width: 600px;
            height: 400px;
            border: 2px white dotted;
            display: flex;
            position: relative;
            top:200px;
        

        }
        .child{
            width: 100px;
            height: 100px;
            background-color: purple;
            transition-property: transform ,border-radius;
            transition-duration: 4s;
            color:white;
             transition-timing-function:cubic-bezier(0.87, -0.29, 0.61, 2.44);
             transition-delay: 5s;
}
.child:hover{
    transform: translateX(500px);
    background-color: red;
    border-radius: 50%;
   
}   
    </style>
</head>
<body>
    <div class="container">
        <div class="child">BOX</div></div>
</body>
</html>
