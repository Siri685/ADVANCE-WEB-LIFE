<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        *{
            margin:0;
            padding:0;
            background-color: black;
            box-sizing: border-box;

        }
        html,body{
            width: 100vw;
            height: 100vh;
            display:flex;
            justify-content: center;
            align-items: center;
          
        


        }
    
        .child1{
            width: 100px;
            height: 500px;
            border: 2px white dotted;
            border-top: 0px;
            }
        .child2{
            width: 100px;
            height: 500px;
            border: 2px white dotted;
            border-bottom: 0px;
            }
        .child3{
            width: 100px;
            height: 500px;
            border: 2px white dotted;
            border-top: 0px;
            }
            .child4{
            width: 100px;
            height: 500px;
            border: 2px white dotted;
            border-bottom: 0px;
            }
            .child5{
            width: 100px;
            height: 500px;
            border: 2px white dotted;
            border-top: 0px;
            }

            .box{
            width: 100px;
            height: 100px;
            background-color: purple;
            animation-name: batman;
            animation-duration: 5s;
            animation-timing-function: linear;
            animation-iteration-count:infinite ;           
            
            color:white;
            
            
}
            @keyframes batman {
    0%{
        transform: translate(0px,-250px) 
    }
    10%{
        transform: translate(0px,250px) 
    }
    20%{
        transform: translate(100px,250px)
    }
    30%{
        transform: translate(100px,-250px) 
    }
    40%{
        transform: translate(200px,-250px)
    }
    50%{
        transform: translate(200px,250px) 
    }
    60%{
        transform: translate(300px,250px)
    }
    70%{
        transform: translate(300px,-250px) 
    }
    80%{
        transform: translate(400px,-250px)
    }
    90%{
        transform: translate(400px,250px) 
    }
    100%{
        transform: translate(500px,250px) 
}
110%{
        transform: translate(600px,250px) 
}
120%{
        transform: translate(600px,-250px) 
}


}

            

    </style>
</head>
<body>
    <div class="box"></div>
        <div class="child1">BOX</div>
        <div class="child2">BOX</div>
        <div class="child3">BOX</div>
        <div class="child4">BOX</div>
        <div class="child5">BOX</div>
        
</body>
</html>
