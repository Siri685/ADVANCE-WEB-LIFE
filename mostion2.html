<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><style>
        *{
            margin:0;
            padding:0;
            background-color: black;
            box-sizing: border-box;

        }
        html,body{
            width: 100vw;
            height: 100vh;
            display:flex;
            justify-content: center;
            align-content: center;


        }
        .container{
            width: 600px;
            height: 400px;
            border: 2px white dotted;
            

        }
        .child{
            width: 400px;
            height: 100px;
            background-color: purple;
            
            transform:translate(200px) ;
            color:white;
}
.child-1{
            width:50px;
            height: 50px;
            background-color: purple;
            
            transform:translate(25px,25px) ;
            color:white;
}
.child-2{
            width:50px;
            height: 50px;
            background-color: purple;
            
            transform:translate(520px,-25px);
            color:white;

}.child-3{
            width:50px;
            height: 50px;
            background-color: purple;
            
            transform:translate(520px,200px);
            color:white;
}.child-4{
           width:50px;
            height: 50px;
            background-color: purple;
            
            transform:translate(25px,150px);
            color:white;
}.child-5{
            width: 50px;
            height: 50px;
            background-color: purple;
            
            transform:translate(290px,-50px)rotate(45deg);
            color:white;
}.child-6{
            width: 150px;
            height: 50px;
            background-color: purple;
            
            transform:translate(400px,-50px);
            color:white;
}.child-7{
            width: 150px;
            height: 50px;
            background-color: purple;
            
            transform:translate(25px,-100px);
            color:white;
}.child-8{
            width: 150px;
            height: 50px;
            background-color: purple;
            
            transform:translate(25px,-250px);
            color:white;
}.child-9{
            width: 150px;
            height: 50px;
            background-color: purple;
            
            transform:translate(400px,-300px);
            color:white;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="child-1">box</div>
        <div class="child-2">box</div>
        <div class="child-3">box</div>
        <div class="child-4">box</div>
        <div class="child-5">box</div>
        <div class="child-6">box</div>
        <div class="child-7">box</div>
        <div class="child-8">box</div>
        <div class="child-9">box</div>
</body>
</html>
